apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mlops
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: mlops-crypto/serving:dev
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: mlops-env }
            - secretRef: { name: mlops-secrets }
          env:
            # The MLflow client defaults to seven retries with exponential backoff.
            # When the tracking server is down that turns "start degraded" into a
            # two-minute hang, which the liveness probe reads as a hung pod and
            # kills — a crashloop caused entirely by waiting politely.
            - name: MLFLOW_HTTP_REQUEST_MAX_RETRIES
              value: "2"
            - name: MLFLOW_HTTP_REQUEST_TIMEOUT
              value: "10"
          ports:
            - { name: http, containerPort: 8000 }
          volumeMounts:
            - name: pipeline-config
              mountPath: /app/config
              readOnly: true
          # /health answers 200 with status "degraded" before the first model is
          # registered, which is deliberate: the pod must stay up so the daily
          # workflow has something to call /reload on.
          # The startup probe owns the slow path, so liveness only judges a pod
          # that has already served once.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: pipeline-config
          configMap:
            name: mlops-pipeline-config
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mlops
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - { name: http, port: 8000, targetPort: http }
