apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlops

# secrets.yaml is deliberately absent — it is created from secrets.example.yaml and
# applied by hand so real credentials never enter the repo or a kustomize build.
resources:
  - namespace.yaml
  - config.yaml
  - db-bootstrap.yaml
  - minio.yaml
  - mlflow.yaml
  - api.yaml
  - migrate-job.yaml

# `labels` rather than the deprecated `commonLabels`, which also writes into
# spec.selector — immutable on Deployments that already exist. These workloads
# were applied from the raw files and carry no part-of label, so commonLabels
# made every sync fail on the selector.
labels:
  - pairs:
      app.kubernetes.io/part-of: mlops-crypto
    includeSelectors: false
