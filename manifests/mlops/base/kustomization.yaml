apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlops

# mlops-secrets lives in sealed/ as ciphertext. postgres-admin stays absent: it
# holds the superuser password for the bootstrap Jobs and should be deleted once
# they have run, not committed.
resources:
  - namespace.yaml
  - sealed/mlops-secrets.sealed.yaml
  - config.yaml
  - db-bootstrap.yaml
  - minio.yaml
  - mlflow.yaml
  - api.yaml
  - migrate-job.yaml

# `labels`, not the deprecated `commonLabels`: that also writes spec.selector,
# which is immutable, and these workloads were applied from raw files with no
# part-of label — so commonLabels made every sync fail on the selector.
labels:
  - pairs:
      app.kubernetes.io/part-of: mlops-crypto
    includeSelectors: false
