apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-env
  namespace: mlops
data:
  MLFLOW_TRACKING_URI: http://mlflow.mlops.svc.cluster.local:5000
  MLFLOW_EXPERIMENT: crypto-direction
  MLFLOW_MODEL_NAME: crypto-direction
  MLFLOW_S3_ENDPOINT_URL: http://minio.mlops.svc.cluster.local:9000
  MLFLOW_ARTIFACT_BUCKET: mlflow
  MODEL_ALIAS: champion
  SYMBOLS: "BTC,ETH,SOL,LINK,XRP"
  COINGECKO_BASE_URL: https://api.coingecko.com/api/v3
  PUSHGATEWAY_URL: ""
  LOG_LEVEL: INFO
  CONFIG_DIR: /app/config
  SQL_DIR: /app/sql
---
# The tunables from config/*.yaml, mounted over the copies baked into the image so
# a retune is `kubectl apply` plus a rerun, not an image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-pipeline-config
  namespace: mlops
data:
  features.yaml: |
    feature_set: hourly_v1
    horizon_hours: 6
    label:
      dead_band: 0.002
    windows:
      returns: [1, 3, 6, 12, 24]
      volatility: [12, 24, 72]
      sma: [12, 24, 72]
      volume_z: [24, 72]
    rsi_period: 14
    min_history_hours: 96
  training.yaml: |
    feature_set: hourly_v1
    model_name: crypto-direction
    split:
      train_frac: 0.7
      val_frac: 0.15
    model:
      type: hist_gradient_boosting
      params:
        max_iter: 400
        learning_rate: 0.05
        max_depth: 6
        min_samples_leaf: 40
        l2_regularization: 1.0
        early_stopping: true
        validation_fraction: null
        random_state: 42
    promotion:
      min_roc_auc: 0.53
      min_accuracy: 0.52
      min_test_rows: 500
