apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: mlops-crypto/mlflow:dev
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Each worker loads the whole app and settles around 900MB, so the
              # stock four OOM inside any sane limit. One is enough for a tracking
              # server whose only clients are a pipeline pod and a browser tab.
              exec mlflow server \
                --host 0.0.0.0 --port 5000 \
                --workers 1 \
                --backend-store-uri "$MLFLOW_BACKEND_URI" \
                --default-artifact-root "s3://$MLFLOW_ARTIFACT_BUCKET/"
          env:
            - name: MLFLOW_BACKEND_URI
              valueFrom:
                secretKeyRef: { name: mlops-secrets, key: MLFLOW_BACKEND_URI }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: mlops-secrets, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: mlops-secrets, key: AWS_SECRET_ACCESS_KEY }
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef: { name: mlops-env, key: MLFLOW_S3_ENDPOINT_URL }
            - name: MLFLOW_ARTIFACT_BUCKET
              valueFrom:
                configMapKeyRef: { name: mlops-env, key: MLFLOW_ARTIFACT_BUCKET }
          ports:
            - { name: http, containerPort: 5000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  selector:
    app: mlflow
  ports:
    - { name: http, port: 5000, targetPort: http }
