apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: mlops-crypto/mlflow:dev
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Each worker loads the whole app at ~900MB, so the stock four OOM
              # inside any sane limit; one serves a pipeline pod and a browser tab.
              #
              # MLflow 3 answers 403 to any Host header it does not recognise
              # (DNS-rebinding protection), and in a cluster every client arrives
              # as a service name or ingress host — so each must be listed.
              exec mlflow server \
                --host 0.0.0.0 --port 5000 \
                --workers 1 \
                --allowed-hosts "localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000,mlflow.mlops,mlflow.mlops:5000,mlflow.mlops.svc,mlflow.mlops.svc:5000,mlflow.mlops.svc.cluster.local,mlflow.mlops.svc.cluster.local:5000,mlflow.192.168.1.34.nip.io,mlflow.100.89.14.18.nip.io" \
                --backend-store-uri "$MLFLOW_BACKEND_URI" \
                --default-artifact-root "s3://$MLFLOW_ARTIFACT_BUCKET/"
          env:
            - name: MLFLOW_BACKEND_URI
              valueFrom:
                secretKeyRef: { name: mlops-secrets, key: MLFLOW_BACKEND_URI }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: mlops-secrets, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: mlops-secrets, key: AWS_SECRET_ACCESS_KEY }
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef: { name: mlops-env, key: MLFLOW_S3_ENDPOINT_URL }
            - name: MLFLOW_ARTIFACT_BUCKET
              valueFrom:
                configMapKeyRef: { name: mlops-env, key: MLFLOW_ARTIFACT_BUCKET }
          ports:
            - { name: http, containerPort: 5000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  selector:
    app: mlflow
  ports:
    - { name: http, port: 5000, targetPort: http }
