# Template only. Copy to secrets.yaml, fill in, apply, and never commit the copy.
#
# Secrets do not cross namespaces, so the shared Postgres credentials are restated
# here rather than referenced from `postgres-secret` in the default namespace.
#
# BOT_DATABASE_URL points at the same Postgres instance but a different database and
# a role that only holds SELECT. Create that role once:
#
#   CREATE ROLE mlops_reader LOGIN PASSWORD '...';
#   GRANT CONNECT ON DATABASE cryptobot TO mlops_reader;
#   GRANT USAGE ON SCHEMA public TO mlops_reader;
#   GRANT SELECT ON ALL TABLES IN SCHEMA public TO mlops_reader;
#   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO mlops_reader;
#
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: mlops
type: Opaque
stringData:
  DATABASE_URL: postgresql://mlops:CHANGE_ME@postgres.default.svc.cluster.local:5432/mlops
  BOT_DATABASE_URL: postgresql://mlops_reader:CHANGE_ME@postgres.default.svc.cluster.local:5432/cryptobot
  MLFLOW_BACKEND_URI: postgresql://mlops:CHANGE_ME@postgres.default.svc.cluster.local:5432/mlflow
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
  COINGECKO_API_KEY: ""
---
# Superuser credentials, used only by the one-shot bootstrap Job that creates the
# mlops/mlflow databases and the two roles. Delete this secret once it has run.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
  namespace: mlops
type: Opaque
stringData:
  PGUSER: postgres
  PGPASSWORD: CHANGE_ME
  # Passwords the bootstrap assigns to the roles it creates. Must match the ones
  # embedded in the DSNs above.
  MLOPS_PASSWORD: CHANGE_ME
  READER_PASSWORD: CHANGE_ME
