# Airflow's task-log volume, declared here rather than by the chart.
#
# The chart hardcodes ReadWriteMany and rejects logs.persistence.accessMode, but
# k3s local-path provides only RWO/RWOP — so the chart's own claim can never be
# provisioned. existingClaim points at this one instead. RWO is sufficient on a
# single node, where pods sharing the volume all land together. Multi-node would
# need an RWX provisioner, or remote logging to the MinIO already running here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs
  namespace: mlops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 3Gi
