# Values for the official Airflow chart 1.22.0 (Airflow 3.2.2), rendered by
# ArgoCD — no helm binary on the node and none needed.
#
# KubernetesExecutor against the Postgres the cluster already runs, a custom image
# carrying the DAGs and the mlops_crypto package, CeleryExecutor extras all off.

airflowVersion: "3.2.2"
executor: KubernetesExecutor

images:
  airflow:
    repository: mlops-crypto/airflow
    tag: dev
    pullPolicy: Never
  # The migration Job needs this image; stock Airflow lacks the DAGs' deps.
  useDefaultImageForMigration: false

# CeleryExecutor extras and duplicate observability — ~1.5GB of RAM on a 15GB node.
postgresql:
  enabled: false
redis:
  enabled: false
flower:
  enabled: false
statsd:
  enabled: false
pgbouncer:
  enabled: false
triggerer:
  # Deferrable operators only. Neither DAG uses one.
  enabled: false

# Pre-created, never chart-generated: the chart's randAlphaNum fallback would mint
# a new value on every sync and roll every pod. Losing the fernet key invalidates
# stored connections; losing the JWT secret breaks running tasks.
data:
  metadataSecretName: airflow-metadata
fernetKeySecretName: airflow-fernet-key
jwtSecretName: airflow-jwt
apiSecretKeySecretName: airflow-api-secret
webserverSecretKeySecretName: airflow-webserver

dags:
  # Baked into the image, not git-synced: no registry here, so DAGs and the code
  # they import ship as one artifact and cannot disagree on a signature.
  gitSync:
    enabled: false
  persistence:
    enabled: false

logs:
  # Task logs live in pods that KubernetesExecutor deletes; without this the UI
  # shows nothing for a completed task.
  persistence:
    enabled: true
    # Ours, not the chart's — see manifests/airflow/logs-pvc.yaml.
    existingClaim: airflow-logs

# Pipeline config — DSNs, MLflow address, MinIO creds — into scheduler and tasks.
extraEnvFrom: |
  - configMapRef:
      name: mlops-env
  - secretRef:
      name: mlops-secrets

# env wins over envFrom on collision, correcting CONFIG_DIR: mlops-env points at
# /app/config, but this image bakes the config elsewhere.
extraEnv: |
  - name: CONFIG_DIR
    value: /opt/airflow/pipeline-config
  - name: PYTHONPATH
    value: /opt/mlops-crypto/src

config:
  core:
    load_examples: "False"
  logging:
    logging_level: INFO

# ArgoCD runs these itself as sync hooks; Helm hooks would never fire.
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

scheduler:
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 1536Mi }

apiServer:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

dagProcessor:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

# Template for every task pod. Training is the outlier at 3Gi, overridden in the DAG.
workers:
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 3Gi }

# Off — the LAN and Tailscale hosts are carried outside the repo, like every
# other workload here.
ingress:
  enabled: false
