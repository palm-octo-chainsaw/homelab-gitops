# Values for the official Airflow chart 1.22.0 (Airflow 3.2.2), rendered by
# ArgoCD — there is no helm binary on the node and none is needed.
#
# Shape of this deployment: KubernetesExecutor against the Postgres the cluster
# already runs, a custom image carrying the DAGs and the mlops_crypto package,
# and every optional component that exists to support CeleryExecutor turned off.

airflowVersion: "3.2.2"
executor: KubernetesExecutor

images:
  airflow:
    repository: mlops-crypto/airflow
    tag: dev
    pullPolicy: Never
  # The migration Job must run the same image as everything else; the upstream
  # default would migrate the database with a stock Airflow that lacks the DAGs'
  # dependencies.
  useDefaultImageForMigration: false

# Everything below exists for CeleryExecutor or for observability we get
# elsewhere. Off means roughly 1.5GB of RAM not spent on a 15GB node.
postgresql:
  enabled: false
redis:
  enabled: false
flower:
  enabled: false
statsd:
  enabled: false
pgbouncer:
  enabled: false
triggerer:
  # Deferrable operators only. Neither DAG uses one; turn this on the day one does.
  enabled: false

# Pre-created, never chart-generated: the chart falls back to randAlphaNum, which
# would mint a new value on every ArgoCD sync and roll every pod with it. Losing
# the fernet key invalidates stored connections; losing the JWT secret breaks
# running tasks' calls back to the API server.
data:
  metadataSecretName: airflow-metadata
fernetKeySecretName: airflow-fernet-key
jwtSecretName: airflow-jwt
apiSecretKeySecretName: airflow-api-secret
webserverSecretKeySecretName: airflow-webserver

dags:
  # Baked into the image rather than pulled by git-sync: this cluster has no
  # registry and images are side-loaded, so DAGs and the code they import ship
  # as one artifact and cannot disagree about a function signature.
  gitSync:
    enabled: false
  persistence:
    enabled: false

logs:
  # Under KubernetesExecutor a task's log lives in a pod that is deleted when it
  # finishes. Without this the UI shows nothing for any completed task.
  persistence:
    enabled: true
    size: 3Gi
    # The chart defaults to ReadWriteMany, because scheduler, api-server,
    # dag-processor and every task pod mount this volume. local-path cannot
    # provide RWX and fails with "NodePath only supports ReadWriteOnce and
    # ReadWriteOncePod", leaving the PVC Pending forever.
    #
    # RWO is correct here only because there is exactly one node: several pods
    # may mount the same RWO volume as long as they share a node. On a
    # multi-node cluster this needs either an RWX provisioner or, better,
    # remote logging to the MinIO already running here — which would need
    # apache-airflow-providers-amazon added to the image.
    accessMode: ReadWriteOnce

# Injects the pipeline's own configuration — database DSNs, MLflow address, MinIO
# credentials — into the scheduler and into every task pod.
extraEnvFrom: |
  - configMapRef:
      name: mlops-env
  - secretRef:
      name: mlops-secrets

# env wins over envFrom on a name collision, which is what corrects CONFIG_DIR:
# mlops-env points at /app/config, the path inside the pipelines image, but in
# this image the config is baked at a different location.
extraEnv: |
  - name: CONFIG_DIR
    value: /opt/airflow/pipeline-config
  - name: PYTHONPATH
    value: /opt/mlops-crypto/src

config:
  core:
    load_examples: "False"
  logging:
    logging_level: INFO

# ArgoCD runs these itself as sync hooks; Helm hooks would never fire.
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

scheduler:
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 1536Mi }

apiServer:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

dagProcessor:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

# The template every KubernetesExecutor task pod is built from. Training is the
# outlier at 3Gi; it gets its own override in the DAG.
workers:
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 3Gi }

# The chart's own ingress stays off — manifests/airflow/ingress.yaml carries the
# LAN and Tailscale hosts, matching every other workload here.
ingress:
  enabled: false
