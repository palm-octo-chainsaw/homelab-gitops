apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlops

# values.yaml is consumed by the Application's Helm source, not applied here, and
# secrets.example.yaml is a CHANGE_ME template. The Ingress lives in
# local/ingresses.yaml — its nip.io hosts encode private addresses.
resources:
  - db-init.yaml
  - logs-pvc.yaml
  # Generated by scripts/create-airflow-secrets.sh. Ciphertext only.
  - sealed/airflow-metadata.sealed.yaml
  - sealed/airflow-db.sealed.yaml
  - sealed/airflow-fernet-key.sealed.yaml
  - sealed/airflow-jwt.sealed.yaml
  - sealed/airflow-api-secret.sealed.yaml
  - sealed/airflow-webserver.sealed.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: mlops-crypto
    includeSelectors: false
