apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlops

# values.yaml is consumed by the Helm source of the Application, not applied as a
# resource. secrets.example.yaml is a CHANGE_ME template and must never be applied.
#
# The Ingress lives in local/ingresses.yaml, applied by hand: its nip.io hosts
# encode the node's LAN and Tailscale addresses, which do not belong in a public
# repo. Same reason the MLflow and API ingresses are not here either.
resources:
  - db-init.yaml
  - logs-pvc.yaml
  # Generated by scripts/create-airflow-secrets.sh, which seals them without a
  # plaintext Secret ever existing. Ciphertext only.
  - sealed/airflow-metadata.sealed.yaml
  - sealed/airflow-db.sealed.yaml
  - sealed/airflow-fernet-key.sealed.yaml
  - sealed/airflow-jwt.sealed.yaml
  - sealed/airflow-api-secret.sealed.yaml
  - sealed/airflow-webserver.sealed.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: mlops-crypto
    includeSelectors: false
