# Template only — real values are generated by scripts/create-airflow-secrets.sh,
# which prints nothing and seals them straight to manifests/airflow/sealed/.
#
# The chart looks each of these up by name and expects the exact key shown.
# Losing airflow-fernet-key invalidates every stored connection password;
# rotating airflow-webserver logs everyone out.
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-metadata
  namespace: mlops
type: Opaque
stringData:
  connection: postgresql://airflow:CHANGE_ME@postgres.default.svc.cluster.local:5432/airflow
---
# Read by the airflow-db-init Job, which creates the role. Must match the
# password embedded in the connection string above.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-db
  namespace: mlops
type: Opaque
stringData:
  AIRFLOW_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-fernet-key
  namespace: mlops
type: Opaque
stringData:
  fernet-key: CHANGE_ME
---
# Signs the tokens task pods use to call the API server back. Airflow 3 only.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-jwt
  namespace: mlops
type: Opaque
stringData:
  jwt-secret: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-api-secret
  namespace: mlops
type: Opaque
stringData:
  api-secret-key: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-webserver
  namespace: mlops
type: Opaque
stringData:
  webserver-secret-key: CHANGE_ME
