apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The controller and its CRD go to kube-system, which is where the upstream
# manifest places them and where kubeseal looks by default.
namespace: kube-system

# The upstream v0.39.1 release manifest, vendored rather than fetched: a URL that
# changes underneath a GitOps repo is not a source of truth. Re-vendor on upgrade.
resources:
  - controller.yaml

# Sealed secrets live next to the workload they belong to
# (manifests/mlops/base/sealed/, manifests/crypto-bot/sealed/), not here — a
# SealedSecret is a resource of the app that consumes it.
