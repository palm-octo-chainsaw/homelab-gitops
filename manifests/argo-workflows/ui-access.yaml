# Login identity for the Argo UI.
#
# argo-server runs in the upstream default auth mode, which means the UI asks for
# a bearer token rather than trusting whoever reaches the address. This is the
# account that token belongs to: it can drive the pipeline in the mlops namespace
# and can see nothing anywhere else — in particular nothing in `default`, where
# the trading bot and its Postgres live.
#
# Mint a token (prints to your terminal, do not paste it anywhere shared):
#   kubectl -n mlops create token argo-ui --duration=720h
# Then in the UI, log in with:  Bearer <token>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-ui
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-ui
  namespace: mlops
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - workflows
      - workfloweventbindings
      - workflowtemplates
      - cronworkflows
      - workflowtaskresults
      - workflowtasksets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-ui
  namespace: mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-ui
subjects:
  - kind: ServiceAccount
    name: argo-ui
    namespace: mlops
