# Every pipeline step is the same image with different arguments, so there is one
# reusable container template and the DAGs just vary the args. Steps pass no data
# between themselves — state lives in Postgres — which is why no artifact
# repository is configured anywhere in this project.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-crypto
  namespace: mlops
spec:
  serviceAccountName: argo-workflow
  podGC:
    strategy: OnWorkflowSuccess
  ttlStrategy:
    secondsAfterCompletion: 604800
    secondsAfterSuccess: 86400
  volumes:
    - name: pipeline-config
      configMap:
        name: mlops-pipeline-config

  templates:
    - name: cli
      inputs:
        parameters:
          - name: args
          - name: cpu
            value: "200m"
          - name: memory
            value: "512Mi"
      # Resource fields are typed quantities, so the CRD schema rejects
      # {{inputs.parameters.*}} in them. podSpecPatch is applied after template
      # substitution and is the supported way to size a step from a parameter.
      podSpecPatch: |
        containers:
          - name: main
            resources:
              requests:
                cpu: "{{inputs.parameters.cpu}}"
                memory: "{{inputs.parameters.memory}}"
              limits:
                memory: "{{inputs.parameters.memory}}"
      container:
        image: mlops-crypto/pipelines:dev
        imagePullPolicy: Never
        args: ["{{inputs.parameters.args}}"]
        command: ["sh", "-c", "exec mlops-crypto $0"]
        envFrom:
          - configMapRef: { name: mlops-env }
          - secretRef: { name: mlops-secrets }
        volumeMounts:
          - name: pipeline-config
            mountPath: /app/config
            readOnly: true
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits: { memory: 512Mi }

    - name: reload-api
      # Best-effort: the model is already registered by this point, and the API
      # picks it up on its next restart regardless. A failed reload must not mark
      # the training run failed.
      container:
        image: curlimages/curl:latest
        command: ["sh", "-c"]
        args:
          - |
            curl -fsS -m 30 -X POST http://api.mlops.svc.cluster.local:8000/reload \
              || echo "reload failed, API will pick the champion up on restart"
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits: { memory: 64Mi }

    - name: hourly
      dag:
        tasks:
          - name: ingest
            template: cli
            arguments:
              parameters: [{ name: args, value: "ingest --days 2" }]
          - name: sync-portfolio
            template: cli
            arguments:
              parameters: [{ name: args, value: "sync-portfolio" }]
          # features waits on ingest only; a portfolio sync failure must not stop
          # the market-data path, which is what training actually consumes.
          - name: features
            template: cli
            dependencies: [ingest]
            arguments:
              parameters:
                - { name: args, value: "features --lookback-hours 336" }
                - { name: memory, value: "1Gi" }
          - name: settle
            template: cli
            dependencies: [features]
            arguments:
              parameters: [{ name: args, value: "settle --window-days 7" }]

    - name: daily
      dag:
        tasks:
          - name: drift
            template: cli
            arguments:
              parameters:
                - { name: args, value: "drift --reference-days 30 --current-days 7" }
                - { name: memory, value: "1Gi" }
          # Training does not depend on drift: a drift report is context, not a
          # gate, and early on it fails outright for lack of history.
          - name: train
            template: cli
            arguments:
              parameters:
                - { name: args, value: "train" }
                - { name: cpu, value: "2000m" }
                - { name: memory, value: "3Gi" }
          - name: reload
            template: reload-api
            dependencies: [train]
