# argo-server serves HTTPS by default; Traefik forwards plain HTTP, so the UI
# 400s until the server is told to speak HTTP. The probe scheme has to change
# too, or the pod never goes ready and the Ingress has no endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-server
  namespace: argo
spec:
  template:
    spec:
      containers:
        - name: argo-server
          args: ["server", "--secure=false"]
          env:
            - name: ARGO_SECURE
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: 2746
              scheme: HTTP
