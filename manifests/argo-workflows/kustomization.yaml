apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No global `namespace:` — the upstream install is namespaced to `argo`, but
# rbac.yaml and ui-access.yaml create identities in `mlops` on purpose.

resources:
  # Pinned to the running version. Bump to upgrade; never track a moving ref.
  - https://github.com/argoproj/argo-workflows/releases/download/v4.1.2/install.yaml
  - rbac.yaml
  - ui-access.yaml
  - workflowtemplate.yaml
  - cronworkflows.yaml

patches:
  # Reapplied every sync, so an upgrade no longer reverts it.
  - path: server-patch.yaml
