# The image ships without config/ or .trw_session/, so these hold the bot's
# on-disk state: targets.json, and the Playwright TRW login reused across
# restarts to avoid hitting device limits.
# storageClassName omitted -> cluster default (local-path).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crypto-bot-config
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crypto-bot-trw-session
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
# Logs survive the pod, so the nightly restart no longer destroys the day that
# just ended — the only copy used to live in an emptyDir. One file per day at
# roughly 2 MB, so 1Gi holds well over a year.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crypto-bot-logs
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
