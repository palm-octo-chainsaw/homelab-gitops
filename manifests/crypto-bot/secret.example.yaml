# Template for crypto-bot-secret. DO NOT commit real values — this is excluded
# from kustomization.yaml so it is never rendered or applied.
#
# Create the real one from the bot's .env plus a DATABASE_URL pointing at the
# dedicated `cryptobot` database on the in-cluster headless postgres service:
#
#   kubectl create secret generic crypto-bot-secret \
#     --from-env-file=.env \
#     --from-literal=DATABASE_URL="postgresql://<user>:<pass>@postgres:5432/cryptobot"
apiVersion: v1
kind: Secret
metadata:
  name: crypto-bot-secret
  namespace: default
type: Opaque
stringData:
  BOT_TOKEN: "REPLACE_ME"
  CHAT_ID: "REPLACE_ME"
  BINANCE_API_KEY: "REPLACE_ME"
  BINANCE_API_SECRET: "REPLACE_ME"
  KRAKEN_API_KEY: "REPLACE_ME"
  KRAKEN_API_SECRET: "REPLACE_ME"
  META_MASK: "REPLACE_ME"
  TRW_EMAIL: "REPLACE_ME"
  TRW_PASSWORD: "REPLACE_ME"
  TRW_TOTP_SECRET: "REPLACE_ME"
  HYPERLIQUID_PRIVATE_KEY: "REPLACE_ME"
  HYPERLIQUID_ACCOUNT_ADDRESS: "REPLACE_ME"
  MIN_TRADE_USD: "1.0"
  REBALANCE_RESERVE_PCT: "0.5"
  # Comma-separated assets no execution venue can trade; reported for manual trading.
  MANUAL_ASSETS: "PAXG"
  # Snapshot sanity gate. A total below MIN_RATIO of the last clean snapshot is
  # recorded as partial (excluded from /performance baselines) instead of trusted.
  # The gate disarms once that baseline is older than MAX_AGE_HOURS.
  SNAPSHOT_GATE_MIN_RATIO: "0.2"
  SNAPSHOT_GATE_MAX_AGE_HOURS: "48"
  DATABASE_URL: "postgresql://USER:PASS@postgres:5432/cryptobot"
