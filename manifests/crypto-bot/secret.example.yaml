# Template for crypto-bot-secret. Excluded from kustomization.yaml, so it is never
# rendered or applied. Create the real one from the bot's .env plus a DATABASE_URL
# pointing at the `cryptobot` database:
#
#   kubectl create secret generic crypto-bot-secret \
#     --from-env-file=.env \
#     --from-literal=DATABASE_URL="postgresql://<user>:<pass>@postgres:5432/cryptobot"
apiVersion: v1
kind: Secret
metadata:
  name: crypto-bot-secret
  namespace: default
type: Opaque
stringData:
  BOT_TOKEN: "REPLACE_ME"
  CHAT_ID: "REPLACE_ME"
  # Telegram user ids allowed to run commands, comma-separated.
  ALLOWED_USER_IDS: "REPLACE_ME"
  BINANCE_API_KEY: "REPLACE_ME"
  BINANCE_API_SECRET: "REPLACE_ME"
  KRAKEN_API_KEY: "REPLACE_ME"
  KRAKEN_API_SECRET: "REPLACE_ME"
  META_MASK: "REPLACE_ME"
  TRW_EMAIL: "REPLACE_ME"
  TRW_PASSWORD: "REPLACE_ME"
  TRW_TOTP_SECRET: "REPLACE_ME"
  MIN_TRADE_USD: "1.0"
  REBALANCE_RESERVE_PCT: "0.5"
  # Comma-separated assets no execution venue can trade; reported for manual trading.
  MANUAL_ASSETS: "PAXG"
  # "binance" (Binance, Kraken and Arbitrum) or "hyperliquid" (that account alone).
  EXECUTION_VENUE: "binance"
  # Trade signal shorts as Hyperliquid perps, at SHORT_LEVERAGE cross.
  SHORTS_ENABLED: "false"
  SHORT_LEVERAGE: "1"
  # The main account's deposit address, and the private key of an API wallet
  # approved for it (trades, cannot withdraw). The account must be Unified.
  HYPERLIQUID_ACCOUNT_ADDRESS: "REPLACE_ME"
  HYPERLIQUID_PRIVATE_KEY: "REPLACE_ME"
  # Sanity gate: a total below MIN_RATIO of the last clean snapshot is recorded as
  # partial rather than trusted, and disarms once that baseline exceeds MAX_AGE_HOURS.
  SNAPSHOT_GATE_MIN_RATIO: "0.2"
  SNAPSHOT_GATE_MAX_AGE_HOURS: "48"
  DATABASE_URL: "postgresql://USER:PASS@postgres:5432/cryptobot"
