# ArgoCD managing itself (v3.5.1).
#
# Auto-sync off permanently — a bad sync removes the thing that would fix it, and
# recovery is a manual apply of upstream install.yaml. Checked in anyway to record
# the version and make upgrades a reviewed diff. ServerSideApply because the
# upstream CRDs exceed the 262144-byte last-applied-configuration annotation that
# a client-side apply would write.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  # No resources-finalizer: deleting this Application would uninstall ArgoCD.
spec:
  project: homelab

  source:
    repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
    targetRevision: master
    path: manifests/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
