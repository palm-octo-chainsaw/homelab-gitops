# Argo Workflows v4.1.2 — upstream install plus this cluster's overlays.
#
# ServerSideApply is required: the Workflow CRD exceeds the 262144-byte limit on
# the last-applied-configuration annotation, so client-side apply fails with
# "metadata.annotations: Too long".
#
# Self-heal is on: the pinned build diffs byte-identical against live, patch
# included. Prune stays off — the argo-server Ingress lives in local/ and is
# applied by hand, so it must never be treated as drift to clean up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
    targetRevision: master
    path: manifests/argo-workflows

  destination:
    server: https://kubernetes.default.svc
    namespace: argo

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
