# Sealed Secrets controller — makes this repo reproducible without putting a
# plaintext credential in it.
#
# What it changes: secrets stop being hand-made objects that exist only in etcd.
# A SealedSecret is committed here, ArgoCD applies it, and the controller
# decrypts it in-cluster into a normal Secret.
#
# What it does NOT change: the controller's private key still lives in
# kube-system on one disk. Repo plus key restores everything; repo alone restores
# nothing. Backing that key up off-box is the step that makes this a disaster
# recovery story rather than a way to hide passwords from GitHub. See
# scripts/backup-sealing-key.sh.
#
# Self-heal is on and prune is off: the controller also creates its own key
# Secret at runtime, which is not in git and must never be treated as drift.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
    targetRevision: master
    path: manifests/sealed-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
