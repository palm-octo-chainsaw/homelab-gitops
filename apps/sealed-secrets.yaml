# Sealed Secrets controller — makes this repo reproducible without a plaintext
# credential in it. A SealedSecret is committed here, ArgoCD applies it, and the
# controller decrypts it in-cluster into a normal Secret.
#
# The private key still lives in kube-system on one disk. Repo plus key restores
# everything; repo alone restores nothing — see scripts/backup-sealing-key.sh.
#
# Prune off: the controller creates its own key Secret at runtime, not in git,
# and it must never be treated as drift.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
    targetRevision: master
    path: manifests/sealed-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
