# Airflow 3.2.2 via the official chart, orchestrating the mlops-crypto pipeline.
#
# Three sources: the upstream chart, this repo as a values reference, and this
# repo again for what the chart does not cover.
#
# Auto-sync off: the chart's migrate and create-user Jobs are sync hooks, so a
# self-healing app would re-run them on every drift check.
#
# Its six Secrets must exist before the first sync — see
# manifests/airflow/secrets.example.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.22.0
      helm:
        releaseName: airflow
        valueFiles:
          - $values/manifests/airflow/values.yaml

    - repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
      targetRevision: master
      ref: values

    - repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
      targetRevision: master
      path: manifests/airflow

  destination:
    server: https://kubernetes.default.svc
    namespace: mlops

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      # Annotation-heavy objects, patched in place across upgrades.
      - ServerSideApply=true
