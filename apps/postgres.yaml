# Shared Postgres, adopted from a hand-created StatefulSet holding live data.
#
# Self-heal is on because the checked-in copy diffs byte-identical against live.
# Re-verify if this file changes: most of a StatefulSet spec is immutable, and a
# mismatch makes self-heal retry a failing patch forever. Prune stays off — being
# wrong here costs data, not a restart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
    targetRevision: master
    path: manifests/postgres

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
