# MinIO, MLflow, the inference API, and the one-shot bootstrap/migration Jobs.
#
# Auto-sync deliberately off. A first sync is safe — it adds a part-of label to
# 13 resources — but the minio-bucket Job sets ttlSecondsAfterFinished, so it
# deletes itself an hour after each run and the app then reports OutOfSync
# forever. With auto-sync that becomes an hourly recreate loop.
#
# Fix before turning this on: make the three Jobs Sync hooks
# (argocd.argoproj.io/hook: Sync, hook-delete-policy: BeforeHookCreation) so
# ArgoCD stops tracking them as drift.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
    targetRevision: master
    # base/ only — jobs/backfill.yaml is run ad hoc and would be recreated on
    # every sync if managed here.
    path: manifests/mlops/base

  destination:
    server: https://kubernetes.default.svc
    namespace: mlops

  syncPolicy:
    syncOptions:
      - CreateNamespace=false  # base/namespace.yaml creates it
