# MinIO, MLflow, the inference API, and the one-shot bootstrap/migration Jobs.
#
# Auto-sync off: the minio-bucket Job sets ttlSecondsAfterFinished and deletes
# itself an hour after each run, so the app reports OutOfSync forever and
# auto-sync becomes an hourly recreate loop. Fix before enabling — make the three
# Jobs Sync hooks (hook: Sync, hook-delete-policy: BeforeHookCreation).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
    targetRevision: master
    # base/ only — jobs/backfill.yaml is ad hoc, recreated on every sync if managed.
    path: manifests/mlops/base

  destination:
    server: https://kubernetes.default.svc
    namespace: mlops

  syncPolicy:
    syncOptions:
      - CreateNamespace=false  # base/namespace.yaml creates it
