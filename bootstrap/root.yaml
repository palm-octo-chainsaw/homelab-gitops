# Root of the app-of-apps — the only object applied by hand. One child
# Application per file in apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/palm-octo-chainsaw/homelab-gitops.git
    targetRevision: master
    path: apps
    # apps/ is flat and holds only Applications; no stray root-owned resources.
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      # Owns only the child Applications. Pruning one deletes it, and its
      # finalizer deletes the workload — removing a file from apps/ uninstalls.
      selfHeal: true
      prune: true
